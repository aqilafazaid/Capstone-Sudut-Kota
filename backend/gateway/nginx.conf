# Sudut Kota — nginx gateway (satu-satunya pintu HTTP di sisi backend)
#
# Prefix = root repo, supaya `root frontend;` dan `root backend/media;` menunjuk
# ke tempat yang benar. Script start/stop di folder ini sudah mengatur prefix.
#
#   Flask  : 127.0.0.1:5000  (tidak pernah terekspos langsung)
#   nginx  : 127.0.0.1:8080  (hanya loopback; ingress publik lewat Tailscale Funnel)
#   /hls/  : dilayani dari disk, tidak melewati Python

worker_processes  1;

error_log  backend/gateway/logs/error.log warn;
pid        backend/gateway/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # `include` relatif terhadap folder config ini (bukan prefix).
    include       tools/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log    backend/gateway/logs/access.log;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    charset         utf-8;

    client_max_body_size 2m;

    # Temp nginx tidak pernah ditaruh di root repo.
    client_body_temp_path backend/gateway/temp/client_body_temp;
    proxy_temp_path       backend/gateway/temp/proxy_temp;
    fastcgi_temp_path     backend/gateway/temp/fastcgi_temp;
    uwsgi_temp_path       backend/gateway/temp/uwsgi_temp;
    scgi_temp_path        backend/gateway/temp/scgi_temp;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/vnd.apple.mpegurl image/svg+xml;

    # Batasi laju API; playlist & segmen tidak terkena.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

    upstream sudut_kota_backend {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        root   frontend;
        index  index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        no-referrer always;

        # Halaman statis: /dashboard maupun /dashboard.html.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # API: header Authorization diteruskan apa adanya ke Flask.
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://sudut_kota_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Playlist HLS: berubah tiap beberapa detik, jangan pernah di-cache.
        location ~ ^/hls/[^/]+/index\.m3u8$ {
            root backend/media;
            default_type application/vnd.apple.mpegurl;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
            limit_except GET { deny all; }
        }

        # Segmen HLS: pendek dan tidak berubah, boleh di-cache singkat.
        location ~ ^/hls/[^/]+/seg_[0-9]+\.ts$ {
            root backend/media;
            default_type video/mp2t;
            add_header Cache-Control "public, max-age=30" always;
            add_header Access-Control-Allow-Origin "*" always;
            limit_except GET { deny all; }
        }

        # Apa pun selain playlist/segmen (mis. ffmpeg.log) tidak boleh dibaca.
        location /hls/ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
