# Sudut Kota — nginx reverse proxy (satu pintu untuk frontend + backend)
#
# Dijalankan dari root repo:
#   tools/nginx/nginx.exe -p "<root-repo>" -c backend/nginx/nginx.conf
#
# Prefix harus root repo supaya `root frontend;` dan include mime.types
# menunjuk ke tempat yang benar. Script start/stop di folder ini sudah
# mengatur prefix tersebut.

worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       ../../tools/nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    charset         utf-8;

    # Temp nginx jangan ditaruh di root repo.
    client_body_temp_path tools/nginx/temp/client_body_temp;
    proxy_temp_path       tools/nginx/temp/proxy_temp;
    fastcgi_temp_path     tools/nginx/temp/fastcgi_temp;
    uwsgi_temp_path       tools/nginx/temp/uwsgi_temp;
    scgi_temp_path        tools/nginx/temp/scgi_temp;

    upstream sudut_kota_backend {
        server 127.0.0.1:5000;
    }

    server {
        listen       8080;
        server_name  localhost;

        root   frontend;
        index  index.html;

        # Halaman statis: dukung /dashboard maupun /dashboard.html.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # API: token X-SK-Token diteruskan apa adanya ke Flask.
        location /api/ {
            proxy_pass http://sudut_kota_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # HLS: playlist berubah tiap 2 detik; jangan buffer/cache di nginx.
        location /hls/ {
            proxy_pass http://sudut_kota_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Template produksi: aktifkan setelah domain + sertifikat tersedia.
    # Tanpa domain, jalankan Cloudflare Tunnel ke 127.0.0.1:8080.
    #
    # server {
    #     listen       443 ssl;
    #     server_name  stream.contoh.id;
    #
    #     ssl_certificate      C:/path/fullchain.pem;
    #     ssl_certificate_key  C:/path/privkey.pem;
    #
    #     location /api/ {
    #         proxy_pass http://sudut_kota_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
