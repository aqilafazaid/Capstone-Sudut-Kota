{% extends "base.html" %}

{% block title %}Registrasi Petugas - Command Center Sudut Kota{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-transparent py-12 px-4 relative overflow-hidden font-sans">
    
    <!-- Latar Belakang Animasi Blob (Warna disesuaikan agar sedikit berbeda dari Login untuk variasi) -->
    <div class="absolute top-10 right-10 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob"></div>
    <div class="absolute top-0 left-20 w-96 h-96 bg-cyan-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-32 right-1/3 w-96 h-96 bg-blue-800 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-blob animation-delay-4000"></div>

    <div class="max-w-md w-full bg-[#030718]/80 backdrop-blur-xl rounded-3xl shadow-[0_0_50px_rgba(37,99,235,0.15)] border border-blue-500/30 p-8 relative z-10">
        
        <div class="text-center mb-8">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Logo_Kementerian_Perhubungan_Republik_Indonesia.png/640px-Logo_Kementerian_Perhubungan_Republik_Indonesia.png" class="h-14 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:scale-110 transition-transform" alt="Logo Dishub">
            <h1 class="text-2xl font-black text-white tracking-widest uppercase">Registrasi Petugas</h1>
            <p class="text-blue-400 text-[10px] mt-2 font-bold tracking-[0.2em] uppercase">Pendaftaran Akun Command Center</p>
        </div>

        <!-- Menggunakan method GET dan mengarah ke login agar tidak terjadi Error 405 (Method Not Allowed) saat demo Capstone -->
        <form method="GET" action="{{ url_for('login') }}" class="space-y-4">
            
            <!-- Input Nama Lengkap -->
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-user text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                </div>
                <input type="text" name="fullname" placeholder="Nama Lengkap" required 
                    class="w-full pl-11 pr-4 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
            </div>

            <!-- Input ID Petugas / NIP -->
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-id-badge text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                </div>
                <input type="text" name="nip" placeholder="NIP / ID Petugas" required 
                    class="w-full pl-11 pr-4 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
            </div>

            <!-- Input Kata Sandi -->
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-key text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                </div>
                <input type="password" id="password_reg" name="password" placeholder="Kata Sandi Baru" required 
                    class="w-full pl-11 pr-12 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-500 hover:text-blue-400 transition-colors" onclick="togglePassword('password_reg', 'eye-icon-1')">
                    <i id="eye-icon-1" class="fa-solid fa-eye"></i>
                </div>
            </div>

            <!-- Konfirmasi Kata Sandi -->
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-shield-check text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                </div>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="Ulangi Kata Sandi" required 
                    class="w-full pl-11 pr-12 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-500 hover:text-blue-400 transition-colors" onclick="togglePassword('password_confirm', 'eye-icon-2')">
                    <i id="eye-icon-2" class="fa-solid fa-eye"></i>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black uppercase tracking-wider py-3.5 rounded-xl shadow-[0_0_20px_rgba(8,145,178,0.3)] hover:shadow-[0_0_30px_rgba(8,145,178,0.5)] border border-cyan-400/50 transform hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Ajukan Pendaftaran
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-white/10 text-center">
            <p class="text-[11px] text-slate-400 font-medium">
                Sudah memiliki otorisasi akses? <br>
                <!-- Tombol kembali ke halaman Login -->
                <a href="{{ url_for('login') }}" class="text-blue-400 font-bold hover:text-blue-300 hover:underline inline-block mt-1">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Halaman Masuk
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        }
    }
</script>

<style>
    /* Animasi Blob Background */
    @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
    }
    .animate-blob {
        animation: blob 10s infinite;
    }
    .animation-delay-2000 {
        animation-delay: 3s;
    }
    .animation-delay-4000 {
        animation-delay: 6s;
    }
</style>
{% endblock %}
