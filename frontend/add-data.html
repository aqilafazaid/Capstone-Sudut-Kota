<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Registrasi Node — Sudut Kota</title>
    <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="asset/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="asset/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261113g">

    <script>
        tailwind.config = { darkMode: 'class' };
        // Bawaan gelap; hanya berubah bila pengguna memilih terang.
        if (localStorage.getItem('color-theme') !== 'light') {
            document.documentElement.classList.add('dark');
        }
    </script>

    <style>
        .bg-mesh {
            background-color: var(--sk-bg-body);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(14,165,233,.12) 0px, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(59,130,246,.12) 0px, transparent 40%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="sk-root font-sans antialiased">

<div id="site-nav"></div>

<main class="flex-grow z-10 relative pt-[100px] md:pt-[130px] bg-mesh min-h-screen pb-32">
    <div class="max-w-3xl mx-auto px-4 md:px-6 relative">

        <div class="absolute top-0 left-4 md:left-10 w-56 h-56 md:w-96 md:h-96 bg-blue-800 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob pointer-events-none"></div>
        <div class="absolute bottom-10 right-4 md:right-10 w-56 h-56 md:w-96 md:h-96 bg-cyan-700 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-2000 pointer-events-none"></div>

        <div class="glass-card p-8 md:p-12 border-t-4 border-blue-500 relative z-10 animate-fade-in-up">

            <div class="flex items-center gap-4 mb-8 border-b sk-line pb-6">
                <div class="w-14 h-14 rounded-2xl sk-soft flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(37,99,235,0.3)]">
                    <i id="form-icon" class="fa-solid fa-network-wired"></i>
                </div>
                <div>
                    <h1 id="form-title" class="text-2xl font-black sk-ink uppercase tracking-wider">Registrasi Node Baru</h1>
                    <p id="form-subtitle" class="text-xs sk-accent font-medium mt-1 tracking-wide">Tambahkan titik pengawasan CCTV baru ke dalam jaringan.</p>
                </div>
            </div>

            <form id="node-form" class="space-y-8" novalidate>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sk-panel-2 p-6 rounded-2xl border sk-line shadow-inner">

                    <div class="space-y-2 md:col-span-2">
                        <label class="block text-[10px] font-bold sk-accent uppercase tracking-widest ml-1" for="f-nama">Nama Titik / Persimpangan</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-tower-cell text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                            </div>
                            <input type="text" id="f-nama" required placeholder="Contoh: Simpang THR"
                                class="glass-input w-full pl-12 pr-4 py-3.5 text-sm font-semibold">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold sk-accent uppercase tracking-widest ml-1" for="f-zona">Zona Wilayah</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-map-location-dot text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                            </div>
                            <input type="text" id="f-zona" list="zona-list" required placeholder="Contoh: Kota Pekalongan"
                                class="glass-input w-full pl-12 pr-4 py-3.5 text-sm font-semibold">
                            <datalist id="zona-list"></datalist>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold sk-accent uppercase tracking-widest ml-1" for="f-jalan">Nama Jalan / Lokasi</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-road text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                            </div>
                            <input type="text" id="f-jalan" placeholder="Contoh: Jl. Hayam Wuruk"
                                class="glass-input w-full pl-12 pr-4 py-3.5 text-sm font-semibold">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold sk-accent uppercase tracking-widest ml-1" for="f-channel">Nomor Channel CCTV</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-hashtag text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                            </div>
                            <input type="text" id="f-channel" placeholder="Contoh: 29"
                                class="glass-input w-full pl-12 pr-4 py-3.5 text-sm font-semibold">
                        </div>
                    </div>

                </div>

                <div class="space-y-4">
                    <div class="border-b sk-line pb-2">
                        <label class="block text-xs font-bold sk-ink uppercase tracking-widest ml-1">Sumber Stream</label>
                        <p class="text-[10px] sk-accent font-medium ml-1 mt-1">Satu URL RTSP per node. Server lokal mengubahnya menjadi HLS (m3u8) untuk mode AI maupun non-AI; tidak ada kolom HLS kedua.</p>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold sk-accent uppercase tracking-widest ml-1" for="f-rtsp">URL RTSP sumber <span class="text-red-400">*</span></label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-link text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                            </div>
                            <input type="text" id="f-rtsp" placeholder="rtsp://user:pass@10.28.110.253:554/Streaming/Channels/2901"
                                class="glass-input w-full pl-12 pr-4 py-3.5 text-sm font-semibold">
                        </div>
                        <p class="text-[10px] sk-muted font-mono ml-1 break-all">HLS otomatis: <span id="hls-auto-url">—</span></p>
                    </div>

                    <label class="flex items-center gap-3 p-4 sk-panel-2 rounded-xl border sk-line cursor-pointer">
                        <input type="checkbox" id="f-aktif" checked class="w-4 h-4 accent-blue-600">
                        <span class="text-xs font-bold sk-muted">Node aktif dan siap diputar di halaman CCTV</span>
                    </label>
                </div>

                <div id="form-error" class="hidden sk-alert sk-alert-error p-3 text-xs font-bold flex items-start gap-2"></div>

                <div class="mt-8 pt-6 border-t sk-line flex flex-col-reverse md:flex-row justify-end items-center gap-4">
                    <a href="dashboard.html" class="w-full md:w-auto px-6 py-3.5 sk-muted hover:text-slate-900 dark:hover:text-white font-bold text-sm text-center transition-colors">
                        <i class="fa-solid fa-xmark mr-1"></i> Batal
                    </a>
                    <button type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-black uppercase tracking-wider px-8 py-3.5 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:shadow-[0_0_25px_rgba(37,99,235,0.6)] border border-blue-400/50 transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Konfigurasi
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div id="site-footer"></div>
<div id="site-bottombar"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="js/public-config.js?v=20261113g"></script>
<script src="js/firebase-config.js?v=20261113g"></script>
<script src="js/firebase-client.js?v=20261113g"></script>
<script src="js/config.js?v=20261113g"></script>

<script src="js/store.js?v=20261113g"></script>
<script src="js/auth.js?v=20261113g"></script>
<script src="js/app.js?v=20261113g"></script>
<script src="js/add-data.js?v=20261113g"></script>
</body>
</html>
