<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Registrasi Petugas — Sudut Kota</title>
    <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="asset/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="asset/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261107a">

    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('color-theme') !== 'light') {
            if (localStorage.getItem('color-theme') !== 'light') {
            document.documentElement.classList.add('dark');
        }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#0a143c] text-slate-800 dark:text-slate-200 flex flex-col min-h-screen font-sans transition-colors duration-300">

<div id="site-nav"></div>

<main class="flex-grow z-10 relative pt-[100px] md:pt-[130px]">
    <div class="bg-white dark:bg-[#111827] w-full min-h-screen rounded-t-[2.5rem] md:rounded-t-[4rem] shadow-2xl relative overflow-hidden border-t-4 border-blue-600 transition-colors duration-300">
        <div class="absolute inset-0 z-0 opacity-[0.35] dark:opacity-10" style="background-image: radial-gradient(#94a3b8 1.5px, transparent 1.5px); background-size: 32px 32px;"></div>

        <div class="min-h-[80vh] flex items-center justify-center py-12 px-4 relative overflow-hidden">
            <div class="absolute top-10 right-10 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob"></div>
            <div class="absolute top-0 left-20 w-96 h-96 bg-cyan-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-blob animation-delay-2000"></div>
            <div class="absolute -bottom-32 right-1/3 w-96 h-96 bg-blue-800 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-blob animation-delay-4000"></div>

            <div class="max-w-md w-full bg-[#030718]/90 backdrop-blur-xl rounded-3xl shadow-[0_0_50px_rgba(37,99,235,0.15)] border border-blue-500/30 p-8 relative z-10">

                <div class="text-center mb-8">
                    <img src="asset/logo-suko.png" class="h-14 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]" alt="Logo Sudut Kota">
                    <h1 class="text-2xl font-black text-white tracking-widest uppercase">Registrasi Petugas</h1>
                    <p class="text-blue-400 text-[10px] mt-2 font-bold tracking-[0.2em] uppercase">Pendaftaran Akun Command Center</p>
                </div>

                <div id="register-alert" class="hidden mb-5 p-3 rounded-xl text-xs font-bold flex items-start gap-3"></div>

                <form id="register-form" class="space-y-4" novalidate>

                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                        </div>
                        <input type="text" id="reg-nama" placeholder="Nama Lengkap" required autocomplete="name"
                            class="w-full pl-11 pr-4 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                    </div>

                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-id-badge text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                        </div>
                        <input type="text" id="reg-nip" placeholder="NIP (opsional)"
                            class="w-full pl-11 pr-4 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                    </div>

                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                        </div>
                        <input type="email" id="reg-email" placeholder="Email" required autocomplete="email"
                            class="w-full pl-11 pr-4 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                    </div>

                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-key text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                        </div>
                        <input type="password" id="password_reg" placeholder="Kata Sandi Baru" required autocomplete="new-password"
                            class="w-full pl-11 pr-12 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-500 hover:text-blue-400 transition-colors" data-toggle-password="password_reg" data-icon="eye-icon-1">
                            <i id="eye-icon-1" class="fa-solid fa-eye"></i>
                        </div>
                    </div>

                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-shield-check text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                        </div>
                        <input type="password" id="password_confirm" placeholder="Ulangi Kata Sandi" required autocomplete="new-password"
                            class="w-full pl-11 pr-12 py-3.5 bg-[#050a1f] border border-blue-900/50 rounded-xl text-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-600 shadow-inner">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-500 hover:text-blue-400 transition-colors" data-toggle-password="password_confirm" data-icon="eye-icon-2">
                            <i id="eye-icon-2" class="fa-solid fa-eye"></i>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black uppercase tracking-wider py-3.5 rounded-xl shadow-[0_0_20px_rgba(8,145,178,0.3)] hover:shadow-[0_0_30px_rgba(8,145,178,0.5)] border border-cyan-400/50 transform hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Ajukan Pendaftaran
                        </button>
                    </div>
                </form>

                <p class="mt-4 text-[10px] text-slate-500 leading-relaxed">
                    Akun baru tidak langsung memiliki akses. Administrator harus memberi peran
                    <b class="text-slate-400">Teknisi</b> atau <b class="text-slate-400">Administrator</b> sebelum dashboard dapat dibuka.
                </p>

                <div class="mt-8 pt-6 border-t border-white/10 text-center">
                    <p class="text-[11px] text-slate-400 font-medium">
                        Sudah memiliki otorisasi akses? <br>
                        <a href="login.html" class="text-blue-400 font-bold hover:text-blue-300 hover:underline inline-block mt-1">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Halaman Masuk
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="site-footer"></div>
<div id="site-bottombar"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="js/public-config.js?v=20261107a"></script>
<script src="js/firebase-config.js?v=20261107a"></script>
<script src="js/firebase-client.js?v=20261107a"></script>
<script src="js/config.js?v=20261107a"></script>

<script src="js/store.js?v=20261107a"></script>
<script src="js/auth.js?v=20261107a"></script>
<script src="js/app.js?v=20261107a"></script>
<script>
    App.init({ active: 'register' });

    const alertBox = document.getElementById('register-alert');

    function showAlert(message, type) {
        const palette = type === 'success'
            ? 'bg-emerald-900/40 text-emerald-200 border border-emerald-500/50'
            : 'bg-red-900/50 text-red-300 border border-red-500/50';
        alertBox.className = `mb-5 p-3 rounded-xl text-xs font-bold flex items-start gap-3 ${palette}`;
        alertBox.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} mt-0.5"></i><span>${message}</span>`;
        alertBox.classList.remove('hidden');
    }

    document.querySelectorAll('[data-toggle-password]').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.togglePassword);
            const icon = document.getElementById(btn.dataset.icon);
            const plain = input.type === 'password';
            input.type = plain ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !plain);
            icon.classList.toggle('fa-eye-slash', plain);
        });
    });

    document.getElementById('register-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const nama = document.getElementById('reg-nama').value.trim();
        const nip = document.getElementById('reg-nip').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('password_reg').value;
        const confirm = document.getElementById('password_confirm').value;

        if (password !== confirm) {
            showAlert('Kata sandi dan konfirmasi tidak sama.', 'error');
            return;
        }

        const result = await Auth.register({ nama, nip, email, password });
        if (!result.ok) {
            showAlert(result.error, 'error');
            return;
        }

        showAlert('Pendaftaran tercatat dengan peran Visitor. Administrator dapat menaikkan peran Anda menjadi Teknisi.', 'success');
        App.toast('Pendaftaran berhasil. Peran awal: Visitor.', 'success');
        setTimeout(() => { location.href = 'login.html?reason=visitor'; }, 2200);
    });
</script>
</body>
</html>
