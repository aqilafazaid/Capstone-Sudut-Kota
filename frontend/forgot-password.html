<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pemulihan Kata Sandi — Sudut Kota</title>
    <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="asset/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="asset/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261113s">

    <script>
        tailwind.config = { darkMode: 'class' };
        // Bawaan gelap; hanya berubah bila pengguna memilih terang.
        if (localStorage.getItem('color-theme') !== 'light') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#0a143c] text-slate-800 dark:text-slate-200 flex flex-col min-h-screen font-sans transition-colors duration-300">

<div id="site-nav"></div>

<main class="flex-grow z-10 relative pt-[84px] md:pt-[100px]">
    <div class="bg-white dark:bg-[#111827] w-full min-h-screen rounded-t-[2.5rem] md:rounded-t-[4rem] shadow-2xl relative overflow-hidden border-t-4 border-blue-600 transition-colors duration-300">
        <div class="absolute inset-0 z-0 opacity-[0.35] dark:opacity-10" style="background-image: radial-gradient(#94a3b8 1.5px, transparent 1.5px); background-size: 32px 32px;"></div>

        <div class="min-h-[64vh] flex items-center justify-center py-8 px-4 relative overflow-hidden">
            <div class="absolute top-10 left-10 w-96 h-96 bg-blue-700 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob"></div>
            <div class="absolute bottom-0 right-10 w-96 h-96 bg-cyan-700 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-blob animation-delay-2000"></div>

            <div class="max-w-md w-full sk-auth-card backdrop-blur-xl rounded-3xl shadow-[0_0_50px_rgba(37,99,235,0.15)] p-8 relative z-10">

                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl sk-soft border flex items-center justify-center text-2xl shadow-[0_0_20px_rgba(37,99,235,0.3)]">
                        <i class="fa-solid fa-unlock-keyhole"></i>
                    </div>
                    <h1 class="text-2xl font-black sk-ink tracking-widest uppercase">Pemulihan Sandi</h1>
                    <p class="sk-accent text-[10px] mt-2 font-bold tracking-[0.2em] uppercase">Verifikasi Identitas Petugas</p>
                </div>

                <div id="reset-alert" class="hidden mb-5 p-3 rounded-xl text-xs font-bold flex items-start gap-3"></div>

                <form id="reset-form" class="space-y-5" novalidate>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-slate-500 group-focus-within:text-blue-400 transition-colors"></i>
                        </div>
                        <input type="email" id="reset-email" placeholder="Email terdaftar" required
                            class="glass-input w-full pl-11 pr-4 py-3.5 text-sm font-semibold">
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black uppercase tracking-wider py-3.5 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.3)] border border-blue-400/50 transform hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Kirim Tautan Pemulihan
                    </button>
                </form>

                <div id="reset-result" class="hidden mt-6 p-4 rounded-xl sk-panel-2 border sk-line">
                    <p class="text-[11px] sk-muted leading-relaxed">
                        <b class="sk-accent">Status:</b> tautan pemulihan dikirim oleh Firebase ke email tersebut.
                        Periksa kotak masuk dan folder spam. Administrator juga dapat mengatur ulang kata sandi
                        akun petugas lewat halaman Kelola Akun.
                    </p>
                </div>

                <div class="mt-6 pt-6 border-t sk-line text-center">
                    <a href="login.html" class="sk-accent font-bold text-[11px] hover:underline">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Halaman Masuk
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="site-footer"></div>
<div id="site-bottombar"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="js/public-config.js?v=20261113s"></script>
<script src="js/firebase-config.js?v=20261113s"></script>
<script src="js/firebase-client.js?v=20261113s"></script>
<script src="js/config.js?v=20261113s"></script>

<script src="js/store.js?v=20261113s"></script>
<script src="js/auth.js?v=20261113s"></script>
<script src="js/app.js?v=20261113s"></script>
<script>
    App.init({ active: 'login' });

    const alertBox = document.getElementById('reset-alert');

    function showAlert(message) {
        alertBox.className = 'mb-5 p-3 rounded-xl text-xs font-bold flex items-start gap-3 sk-alert sk-alert-warning';
        alertBox.innerHTML = `<i class="fa-solid fa-circle-info mt-0.5"></i><span>${message}</span>`;
        alertBox.classList.remove('hidden');
    }

    document.getElementById('reset-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('reset-email').value.trim();
        if (!email) {
            showAlert('Masukkan email terlebih dahulu.');
            return;
        }
        const result = await Auth.resetPassword(email);
        if (!result.ok) {
            showAlert(result.error);
            return;
        }
        document.getElementById('reset-result').classList.remove('hidden');
        App.toast('Tautan reset dikirim ke email tersebut.', 'success');
    });
</script>
</body>
</html>
