user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

# ========================================================
# BLOK RTMP: MENERIMA VIDEO DARI PC AI LOKAL (PORT 1935)
# ========================================================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
            
            # Mengaktifkan konversi otomatis ke HLS
            hls on;
            hls_path /var/www/hls;
            
            # Memotong video per 2 detik (Sesuai dengan konfigurasi FFmpeg)
            hls_fragment 2s;
            hls_playlist_length 10s;
        }
    }
}

# ========================================================
# BLOK HTTP: MENYAJIKAN M3U8 KE WEB VERCEL (PORT 8091)
# ========================================================
http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # Menggunakan port 8091 sesuai infrastruktur CCTV Non-AI Anda
        listen 8091;
        server_name _;

        location /hls {
            # Menonaktifkan cache agar video benar-benar real-time (Live)
            add_header Cache-Control no-cache;

            # Konfigurasi CORS (Wajib agar Frontend Vercel bisa mengakses)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept' always;

            # Menangani preflight request dari peramban web
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            # Menunjuk ke folder fisik tempat file .m3u8 dan .ts disimpan
            alias /var/www/hls;
        }
    }
}
